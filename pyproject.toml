[project]
name = "icfm"
version = "0.1.0"
description = "In-Context Flow Matching: Amortized Generative Modeling from Support Sets"
authors = [{name = "Daniel Matsui Smola", email = "daniel@matsuismola.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchdiffeq>=0.2.4",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "wandb>=0.16.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "python-dotenv>=1.0.0",
    "datasets>=2.18.0",
    "torchvision>=0.17.0",
    "diffusers>=0.37.1",
    "transformers>=5.7.0",
    "accelerate>=1.13.0",
    "safetensors>=0.7.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.3.0", "pytest>=8.0.0"]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu124"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
