# Base configuration for ICFM experiments
# Copy and modify for specific experiments; never edit this file directly.

seed: 42

# Data
data:
  d: 2                          # ambient dimension
  support_size: 50              # m: number of support points per task
  target_size: 256              # n: target points per training step
  meta_distribution: "mixed"    # gaussian_mixture | rings | moons | spirals | mixed
  meta_params:
    min_components: 2
    max_components: 8
    mean_scale: 5.0
    cov_scale: 1.0
    anisotropic: true

# Model
model:
  d_model: 128                  # hidden dimension
  n_heads: 4                    # number of attention heads (1 exact + learned)
  n_layers: 3                   # number of transformer layers
  use_exact_head: true          # include frozen Gaussian-kernel head (Thm 5.2)
  time_embedding: "sinusoidal"  # sinusoidal | learned
  sigma_min: 0.01               # minimum noise level

# Training
training:
  batch_size: 256               # number of tasks per batch
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  max_steps: 100000
  warmup_steps: 1000
  grad_clip_norm: 1.0
  time_sampling: "uniform"      # uniform | log_uniform_bandwidth
  mixed_precision: true
  checkpoint_every: 5000
  eval_every: 1000
  log_every: 100
  compile: false                # torch.compile optimization

# Evaluation
evaluation:
  n_eval_tasks: 100             # number of held-out tasks
  n_generated: 500              # samples to generate per task
  ode_steps: 100                # Euler steps for ODE integration
  t_min: 1.0e-5                 # ODE integration start time (t=0 is singular)
  mmd_sigma: null               # null = median heuristic
  ode_method: "euler"           # euler | dopri5
  metrics:
    - velocity_mse
    - mmd
    - c2st

# W&B
wandb:
  project: "ic-flow-matching"
  entity: null
  tags: []
