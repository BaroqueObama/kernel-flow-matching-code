# L1-ImageNet: Latent-space ICFM on DINOv2+PCA features — exact head ON
# Sweep via: --override data.d=X data.support_size=Y seed=Z

seed: 42

data:
  d: 16
  support_size: 50
  target_size: 256
  meta_distribution: "imagenet"
  meta_params:
    features_dir: "data/imagenet_dino_pca"
    split: "train"

model:
  d_model: 128
  n_heads: 4
  n_layers: 3
  use_exact_head: true
  time_embedding: "sinusoidal"
  sigma_min: 0.01

training:
  batch_size: 256
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  max_steps: 100000
  warmup_steps: 1000
  grad_clip_norm: 1.0
  time_sampling: "uniform"
  mixed_precision: true
  checkpoint_every: 5000
  eval_every: 1000
  log_every: 100
  compile: false

evaluation:
  n_eval_tasks: 100
  n_generated: 500
  ode_steps: 100
  t_min: 1.0e-5
  mmd_sigma: null
  ode_method: "euler"
  metrics:
    - velocity_mse
    - mmd
    - c2st

wandb:
  project: "ic-flow-matching"
  entity: null
  tags: ["L1-imagenet", "dino-pca", "exact-head-on"]
